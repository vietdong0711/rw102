<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Manage Account</title>

        <!-- bs3-cdn : thêm thư viện Bootstrap + jquery -->
        <link
            rel="stylesheet"
            media="screen"
            href="//netdna.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css"
        />
        <script src="//code.jquery.com/jquery.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <script src="//netdna.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>
        <link rel="stylesheet" href="index.css" />

    transition: background-color 0.3s ease, color 0.3s ease;
} */
        </style> -->
    </head>
    <body>
        <div class="container">
            <button type="button" class="btn btn-default" id="themeId">
                <!-- <i class="fa fa-moon-o" style="font-size: 24px"></i>
                <i class="fa fa-sun-o" style="font-size: 24px"></i> -->
            </button>

            <!-- bs3-form-horizontal : tạo form nhanh -->
            <form action="" method="POST" class="form-horizontal" role="form">
                <div class="form-group">
                    <legend>Manage Account</legend>
                </div>

                <!-- bs3-col:+ số cột < 12 -->
                <div class="col-xs-9 col-sm-9 col-md-9 col-lg-9">
                    <!-- bs3-input:text:h       tạo ô nhập text nhanh -->
                    <div class="form-group">
                        <label for="inputSearch" class="col-sm-2 control-label"
                            >Search:</label
                        >
                        <div class="col-sm-6">
                            <input
                                type="text"
                                name="Search"
                                id="inputSearch"
                                class="form-control"
                                value=""
                                required="required"
                                pattern=""
                                title=""
                            />
                        </div>

                        <button
                            type="button"
                            class="btn btn-info"
                            onclick="loadTable()"
                        >
                            <span
                                class="glyphicon glyphicon-search"
                                aria-hidden="true"
                            ></span>
                        </button>
                    </div>
                </div>

                <div class="col-xs-3 col-sm-3 col-md-3 col-lg-3">
                    <a
                        class="btn btn-success"
                        data-toggle="modal"
                        href="#modal-id"
                    >
                        <span
                            class="glyphicon glyphicon-plus"
                            aria-hidden="true"
                        ></span>

                        Add</a
                    >
                </div>
            </form>

            <!-- bs3-table : tạo table nhanh -->
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Department name</th>
                        <th>Position name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody class="account-table-body">
                    <!-- vị trí này sẽ được đưa dữ liệu từ file index.js vào -->
                </tbody>
            </table>

            <!-- bs3-modal tạo ra 1 màn hình popup nhanh -->
            <div class="modal fade" id="modal-id">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button
                                type="button"
                                class="close"
                                data-dismiss="modal"
                                aria-hidden="true"
                            ></button>
                            <h4 class="modal-title"></h4>
                        </div>
                        <div class="modal-body" style="height: 200px">
                            <div class="form-group">
                                <label
                                    for="inputUsername"
                                    class="col-sm-4 control-label"
                                    >Username:</label
                                >
                                <div class="col-sm-8">
                                    <input
                                        type="text"
                                        name="Username"
                                        id="inputUsername"
                                        class="form-control"
                                        value=""
                                        required="required"
                                        pattern=""
                                        title=""
                                    />
                                </div>
                            </div>

                            <div class="form-group">
                                <label
                                    for="inputEmail"
                                    class="col-sm-4 control-label"
                                    >Email:</label
                                >
                                <div class="col-sm-8">
                                    <input
                                        type="email"
                                        name="Email"
                                        id="inputEmail"
                                        class="form-control"
                                        value=""
                                        required="required"
                                        title=""
                                    />
                                </div>
                            </div>

                            <div class="form-group">
                                <label
                                    for="inputDepartmentName"
                                    class="col-sm-4 control-label"
                                    >DepartmentName:</label
                                >
                                <div class="col-sm-8">
                                    <input
                                        type="text"
                                        name="DepartmentName"
                                        id="inputDepartmentName"
                                        class="form-control"
                                        value=""
                                        required="required"
                                        pattern=""
                                        title=""
                                    />
                                </div>
                            </div>

                            <div class="form-group">
                                <label
                                    for="inputPositionName"
                                    class="col-sm-4 control-label"
                                    >PositionName :</label
                                >
                                <div class="col-sm-8">
                                    <input
                                        type="text"
                                        name="PositionName"
                                        id="inputPositionName"
                                        class="form-control"
                                        value=""
                                        required="required"
                                        pattern=""
                                        title=""
                                    />
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-default"
                                data-dismiss="modal"
                            >
                                Close
                            </button>
                            <button
                                type="button"
                                class="btn btn-success"
                                onclick="save()"
                            >
                                Save
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
